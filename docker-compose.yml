services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: turbosquad
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./back
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=turbosquad
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__Key: ${Jwt__Key:?Set Jwt__Key in .env}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      LAYA_API_TOKEN: ${LAYA_API_TOKEN:-}
      Database__MigrateOnStartup: "true"
      ContentSeed__SeedOnStartup: "true"
      DemoAccounts__SeedOnStartup: ${DEMO_ACCOUNTS_SEED:-false}
      DemoAccounts__conductor-star__Password: ${DEMO_CONDUCTOR_STAR_PASSWORD:-}
      DemoAccounts__conductor-novice__Password: ${DEMO_CONDUCTOR_NOVICE_PASSWORD:-}
      DemoAccounts__manager-methodologist__Password: ${DEMO_MANAGER_METHODOLOGIST_PASSWORD:-}
    ports:
      - "127.0.0.1:5017:8080"
    depends_on:
      db:
        condition: service_healthy

  front:
    build: ./front
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
