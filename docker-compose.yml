# The only database is the team's shared Postgres on the VPS: its address and credentials come from .env.
# Other values fall back to public local-demo defaults.
services:
  api:
    build: ./back
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres:?set it in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      Jwt__Key: ${Jwt__Key:-local_demo_jwt_key_replace_with_random_32_chars}
      Integration__ApiKey: ${INTEGRATION_API_KEY:-local_demo_integration_key}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      LAYA_API_TOKEN: ${LAYA_API_TOKEN:-}
      # Every compose up applies committed EF Core migrations to the shared DB.
      Database__MigrateOnStartup: "true"
      ContentSeed__SeedOnStartup: "true"
      DemoAccounts__SeedOnStartup: ${DEMO_ACCOUNTS_SEED:-true}
      DemoAccounts__conductor-star__Password: ${DEMO_CONDUCTOR_STAR_PASSWORD:-local_demo_star_password}
      DemoAccounts__conductor-novice__Password: ${DEMO_CONDUCTOR_NOVICE_PASSWORD:-local_demo_novice_password}
      DemoAccounts__manager-methodologist__Password: ${DEMO_MANAGER_METHODOLOGIST_PASSWORD:-local_demo_manager_password}
    ports:
      - "127.0.0.1:5017:8080"

  front:
    build: ./front
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
